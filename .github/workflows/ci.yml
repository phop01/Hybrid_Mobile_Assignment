# ตรวจคุณภาพโค้ดอัตโนมัติทุกครั้งที่ push: typecheck + lint + test
name: ตรวจคุณภาพโค้ด

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Jest
        run: npm test -- --ci
      - name: API smoke test (แจ้งซ่อม / ประกาศ / แจ้งเตือน)
        run: |
          PUSH_DRY_RUN=1 npm run api &
          sleep 3
          npm run smoke
